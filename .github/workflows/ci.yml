name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/embodied_rt

      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        run: |
          source /opt/ros/humble/setup.bash
          sudo rosdep init || true
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y \
            --skip-keys="moveit_ros_planning_interface tf2 tf2_geometry_msgs robot_state_publisher moveit_resources_panda_description python3-torch python3-transformers python3-pil"

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select embodied_rt --cmake-args -DBUILD_TESTING=OFF
        working-directory: ${{ github.workspace }}

      - name: Test
        if: false
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --packages-select embodied_rt
          colcon test-result --verbose
        working-directory: ${{ github.workspace }}
