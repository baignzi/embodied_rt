name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/embodied_rt

      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ros-humble-ament-cmake-gtest

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select embodied_rt --cmake-args -DBUILD_TESTING=OFF
        working-directory: ${{ github.workspace }}

      - name: Test
        if: false
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --packages-select embodied_rt
          colcon test-result --verbose
        working-directory: ${{ github.workspace }}
