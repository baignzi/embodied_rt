name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/embodied_rt

      - name: Install ROS 2 Humble
        run: |
          sudo apt update && sudo apt install -y curl gnupg lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(source /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt update
          sudo apt install -y ros-humble-ros-base ros-humble-rclcpp ros-humble-sensor-msgs ros-humble-trajectory-msgs ros-humble-std-msgs ros-humble-geometry-msgs ros-humble-std-srvs ros-humble-ament-cmake
          sudo apt install -y python3-colcon-common-extensions python3-rosdep

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select embodied_rt --cmake-args -DBUILD_TESTING=OFF
        working-directory: ${{ github.workspace }}
